name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  pytest:
    name: Python 3.11 / Windows
    runs-on: windows-latest
    timeout-minutes: 10

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression suite
        run: python -m pytest tests -q

  coordination:
    name: Coordination contract / Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: coordination/cloudflare

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install coordination dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check coordination adapter
        run: pnpm run typecheck

      - name: Run coordination contract tests
        run: pnpm test
